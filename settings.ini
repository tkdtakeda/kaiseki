; ============================================================
;  folderscan 設定ファイル
;  書式 : キー=値   ( ; または # で始まる行はコメント )
;  [ ] の見出しは読みやすさのためだけのもので、動作には影響しません。
;  キーを消した場合は既定値 ( v5.18 と同じ値 ) が使われます。
;
;  ここの値は「配布時の初期値」です。ツールの更新でこのファイルが上書きされても困らないよう、
;  自分用に変えたい値は folderscan の入力欄で s を押し、設定メニューから変更してください。
;  変更した項目だけが PC 側 ( %LOCALAPPDATA%\folderscan\user_settings.json ) に保存され、
;  このファイルより優先されます。メニューで - を入力するとこのファイルの値に戻ります。
; ============================================================

[結果の表示]
; 1 = スキャン終了後にレポートをメモ帳で開く / 0 = ファイルに保存するだけ
OPENRESULT=0

[自己診断 (diag)]
; 1 = スキャン後に自己診断を行い、diag_*.json / diag_*.txt を保存して要点をコンソールに表示する
DIAG=1
; コンソールに表示する重要な指摘の件数 ( 全件は diag ファイル )
DIAGTOP=10

[見取り図 (map)]
; 1 = システムの見取り図 map.html / latest_map.html を作る ( Edge で開く。雛形は templates フォルダ )
MAP=1

[scan.txt に出す生データ]
; 1 = [8] すべての .dat の全ダンプ ( 16進 / テキスト ) を出す / 0 = 出さない ( 解析結果は出る )
DUMPDAT=0
; 1 = [10] すべてのファイルの本文 ( バイナリは文字列 ) を出す / 0 = 出さない ( 件数と解析結果は出る )
DUMPTEXT=0
; 0 のときでも中身を出したいファイル。パスかワイルドカードを ; 区切りで ( 例 : app\server.py;*.ini )
; AI から「このファイルの中身が見たい」と依頼されたら、ここに書いて再スキャンする
DUMPFILES=

[cab / ヘッダー / dat ダンプ (v2)]
; 1フォルダあたり、中身を一覧表示する cab の数
MAXCAB=3
; 1フォルダあたり、TEMP に展開する cab の数 ( 全部展開するなら 9999 など )
CABEXT=1
; dat 以外のファイルのヘッダーダンプで表示するバイト数
HEADBYTES=64
; 1フォルダあたり、ヘッダーダンプするファイル数の上限
HEXMAX=20
; 1 = 展開した cab の中の .dat も全ダンプする
DATINCAB=1
; 0 = dat ファイルを全部ダンプ / N = 先頭 N MB だけダンプ
DATMAXMB=0
; レコード長の推定に使うバイト数
RECSAMPLE=32768
; レコード長の候補として調べる最大値
RECLAG=4096

[内容 / データ構造 / 連携 (v3)]
; 1 = 全ファイルの SHA256 を計算する ( [13] 同一内容の判定に必要 )
HASHALL=1
; バイナリから取り出す ASCII 文字列の最小長
MINSTR=4
; 0 = ファイル全体を読む / N = 先頭 N MB だけ読む ( 巨大ファイルでメモリ不足になる場合に指定 )
LINKMAXMB=0
; 1ファイルあたりに集めるキー値候補の上限
KEYMAX=20000
; これより多くのファイルに出てくるキー値は、ペア集計から除外する ( ありふれ過ぎて意味がない )
KEYMAXFILES=50
; [14] で1ファイルあたりに表示する KEY 連携の上限 ( 全件は [12] )
KEYTOP=10
; データ構造の解析に使うレコード / 行の上限
PROFREC=2000
; バイナリを固定長レコードとみなす自己相関の最小値 ( % )
RECMIN=50
; 内容を解析しない拡張子 ( 一覧には載ります )
SKIPEXT=.cab .zip .7z .gz .lzh .rar .jpg .jpeg .png .gif .bmp .tif .tiff .ico .mp4 .avi .wmv .mov .mp3 .wav
; 固定長レコードかを調べるバイナリの拡張子
RECEXT=.dat .bin (none)

[意味的な依存関係 (v4 / v5)]
; [16-7] ファイル間のシンボル利用で使う、シンボル名の最小長
SYMMIN=4
; 1 = mermaid 図に KEY ( 共通キー値 ) の候補エッジも描く
MERMAIDKEY=0
; 1 = mermaid 図に SYM ( シンボル名 ) の候補エッジも描く
MERMAIDSYM=1
; 1 = mermaid 図に weak エッジも描く ( [17-1] には常に全件載ります )
MERMAIDWEAK=0
; 汎用的すぎる json キー名 ( [16-4] で証拠を弱く扱う )
GENERICKEYS=id name key value values type path file files label data item items list text title url uri img image src dest mode status kind default defaults version enabled options option config settings size width height color index count

[ギャップ調査 / 履歴 (v5.10 -)]
; HTTP ラッパー関数を何段まで継承するか ( 0 = 直接の http 呼び出しのみ )
WRAPDEPTH=2
; ( v5.10 の名残。v5.12 以降は未使用 )
REVIEWMAX=25
; ギャップ調査で表示するソース行の最大文字数
SNIPLEN=220
; 種類ごとに調査するギャップ数の上限 ( 全ギャップは一覧と台帳に残ります )
GAPMAX=30
; 初回のギャップ行の前後に表示する行数 ( 同じギャップが再出現するたびに +3 )
GAPCTX=3
; 1 = folderscan_history.tsv に指標を追記し、前回との差を表示する
HISTORY=1
